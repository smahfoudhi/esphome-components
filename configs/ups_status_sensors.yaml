    ups_hid_id: ups_monitor
    name: "UPS Status"
    id: ups_status
    type: status

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "UPS Status Code"
    type: status_code

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Detected UPS Protocol"
    type: protocol